name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash`. Deliberately not a required context — see ci.yaml.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ee73220eb9cb488f4a19f636307cddc85fc602bc # v2.16.1
    with:
      recipes: '["vuln"]'
