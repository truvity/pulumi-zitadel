name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash`. Deliberately not a required context — see ci.yaml.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b19968438f6f19b681517c4e2cfcb87fe7887673 # v2.16.3
    with:
      recipes: '["vuln"]'
