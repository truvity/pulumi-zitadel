name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash`. Deliberately not a required context — see ci.yaml.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@49248a6cebd3720ac7f2eaf2e98ec97c0967b3b6 # v2.17.0
    with:
      recipes: '["vuln"]'
