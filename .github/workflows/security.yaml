name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe the shared workflow runs everywhere else, instead of
  # a hand-rolled copy that installed devbox through an UNPINNED
  # `curl | bash`. Deliberately not a required context — see ci.yaml.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ce73f615db4348e9114369c7c321ca09dcd4d361 # v2.10.8
    with:
      recipes: '["vuln"]'
