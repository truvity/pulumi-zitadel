# Calls the shared workflow (truvity/ci-workflows), which runs each
# Justfile recipe as its OWN parallel job. This was the last repository
# in the estate still running a hand-rolled copy: one serial job that
# installed devbox through an unpinned `curl | bash`, so a red result
# told you only that something failed.
#
# Hosted runners: minutes are free on public repositories, so the
# fan-out costs nothing.
#
# Pinned by COMMIT SHA with a version comment. The SHA is what runs; the
# comment is what lets Renovate resolve the pin and propose the next
# one. Without it the pin freezes silently.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@6d7352b5fe172b46ae0fca37242f9ee91855f57e # v2.2.0
    with:
      # `build` already depends on provider + generate, and
      # verify-generate re-runs generate and asserts the tree is clean —
      # which the shared recipe action now asserts for every recipe
      # anyway. NOT `vuln`: it runs in security.yaml, which is not a
      # required context. Five reachable stdlib advisories with no
      # released fix made this repo unmergeable for three days,
      # including the pull request that would have fixed it.
      recipes: '["build","lint","verify-generate"]'

  # Stable name for branch protection: the matrix reports as
  # "recipes / build" and so on, so a required context called "check"
  # would never arrive and every PR would hang waiting for it.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All recipes passed
        run: |
          echo "recipes: ${{ needs.recipes.result }}"
          [ "${{ needs.recipes.result }}" = "success" ]
